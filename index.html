<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===== МЕТА-ТЕГИ ===== -->
    <!-- Кодировка: чтобы русский и английский текст отображался без кракозябр -->
    <meta charset="UTF-8">

    <!-- Viewport: обязательно для адаптивности на мобильных устройствах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Описание сайта: показывается в поисковиках и при шеринге ссылки -->
    <meta name="description" content="Python-разработчик. Автоматизация, интеграции, быстрые и надёжные инструменты для бизнеса.">

    <!-- Заголовок вкладки браузера -->
    <title>Твоё Имя | Python-разработчик</title>

    <!-- ===== ПОДКЛЮЧЕНИЕ СТИЛЕЙ ===== -->
    <!-- Основной файл стилей. Создадим его на следующем шаге -->
    <link rel="stylesheet" href="css/style.css">

    <!-- ===== ФАВИКОНКА (иконка вкладки) ===== -->
    <!-- Пока используем emoji как заглушку. Позже заменим на нормальный favicon.ico -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
</head>
<body>

    <!-- ============================================= -->
    <!-- ПАЗЛ 3: ШАПКА САЙТА (header + навигация)     -->
    <!-- Будет заполнен позже                         -->
    <!-- ============================================= -->
    <!-- ============================================= -->
<!-- ПАЗЛ 3: ШАПКА САЙТА (header + навигация)     -->
<!-- ============================================= -->
<header id="header">
    <!-- 
      Контейнер ограничивает ширину и центрирует содержимое шапки.
      Сама шапка тянется на всю ширину экрана, а контент внутри — нет.
    -->
    <div class="container header-inner">

        <!-- ===== ИМЯ-ЛОГОТИП (слева) ===== -->
        <!-- 
          При клике на имя пользователь прокручивается наверх страницы.
          href="#" — это якорь на самый верх.
          class="logo" — для стилизации (цвет, размер шрифта).
        -->
        <a href="#" class="logo">Arlen Aliaskar uulu</a>

        <!-- ===== НАВИГАЦИЯ (справа) ===== -->
        <nav class="header-nav">
            <!-- 
              Список ссылок. Пока здесь только переключатель языков.
              Позже можно добавить ссылки на секции: Проекты, Контакты.
            -->

            <!-- ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ (выпадающий) ===== -->
            <!-- 
              .lang-switcher — контейнер всего переключателя.
              При наведении на него показываем выпадающее меню.
            -->
            <div class="lang-switcher">

                <!-- Текущий язык (видимый всегда) — флаг Великобритании -->
                <!-- 
                  data-lang="en" — атрибут для JavaScript.
                  Пока JS нет, но закладываем заранее.
                -->
                <span class="lang-current" data-lang="en">🇬🇧</span>

                <!-- Выпадающее меню (скрыто, показывается при наведении) -->
                <!-- 
                  .lang-dropdown — список альтернативных языков.
                  По умолчанию скрыт через CSS (opacity: 0).
                -->
                <ul class="lang-dropdown">
                    <li>
                        <!-- 
                          Каждый язык — кнопка, чтобы позже повесить обработчик.
                          data-lang="kg" — кыргызский.
                          Пока не работает, просто заглушка.
                        -->
                        <button class="lang-option" data-lang="kg">🇰🇬</button>
                    </li>
                    <li>
                        <!-- data-lang="ru" — русский -->
                        <button class="lang-option" data-lang="ru">🇷🇺</button>
                    </li>
                </ul>
            </div>

            <!-- ===== ССЫЛКА НА GITHUB ===== -->
            <!-- 
              target="_blank" — открывается в новой вкладке.
              rel="noopener" — безопасность (защита от window.opener атак).
              aria-label — для скринридеров (доступность).
            -->
            <a href="https://github.com/arlenadamaliev-lgtm"
               target="_blank"
               rel="noopener"
               class="header-icon-link"
               aria-label="GitHub">
                <!-- Иконка GitHub (встроенный SVG, не требует загрузки файла) -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
            </a>

            <!-- ===== ССЫЛКА НА TELEGRAM ===== -->
            <a href="https://t.me/lApollonicusl"
               target="_blank"
               rel="noopener"
               class="header-icon-link"
               aria-label="Telegram">
                <!-- Иконка Telegram (встроенный SVG) -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.46-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.015-.15-.056-.212s-.174-.04-.249-.024c-.106.024-1.793 1.139-5.062 3.345-.479.329-.913.489-1.302.481-.428-.009-1.252-.242-1.865-.441-.752-.244-1.349-.374-1.297-.789.027-.216.324-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.015 3.333-1.386 4.025-1.627 4.476-1.635.099-.002.321.023.465.138.121.098.154.233.171.327.016.094.036.307.02.477z"/>
                </svg>
            </a>
        </nav>
    </div>
</header>

    <!-- ============================================= -->
    <!-- ОСНОВНОЙ КОНТЕНТ СТРАНИЦЫ                     -->
    <!-- ============================================= -->
    <main>

        <!-- ============================================= -->
        <!-- ПАЗЛ 4: HERO-СЕКЦИЯ (первый экран)           -->
        <!-- Будет заполнен позже                         -->
        <!-- ============================================= -->
        <section id="hero">
            <!-- Сюда вставим: фото, имя, ударную фразу, кнопку -->
        </section>

        <!-- ============================================= -->
        <!-- ПАЗЛ 5: ПОЧЕМУ PYTHON (3 карточки)           -->
        <!-- Будет заполнен позже                         -->
        <!-- ============================================= -->
        <section id="why-python">
            <!-- Сюда вставим: заголовок + 3 карточки с преимуществами -->
        </section>

        <!-- ============================================= -->
        <!-- ПАЗЛ 6: ПОЧЕМУ Я (обо мне + условия)         -->
        <!-- Будет заполнен позже                         -->
        <!-- ============================================= -->
        <section id="about-me">
            <!-- Сюда вставим: 4 блока (переход в IT, гибкость, честность, оплата) -->
        </section>

        <!-- ============================================= -->
        <!-- ПАЗЛ 7: ПРОЦЕСС РАБОТЫ (4 шага)              -->
        <!-- Будет заполнен позже                         -->
        <!-- ============================================= -->
        <section id="workflow">
            <!-- Сюда вставим: таймлайн из 4 шагов -->
        </section>

        <!-- ============================================= -->
        <!-- ПАЗЛ 8: ПРОЕКТЫ (портфолио + ссылка на GitHub)-->
        <!-- Будет заполнен позже                         -->
        <!-- ============================================= -->
        <section id="projects">
            <!-- Сюда вставим: карточки проектов + ссылку "Больше на GitHub" -->
        </section>

        <!-- ============================================= -->
        <!-- ПАЗЛ 9: КОНТАКТЫ (призыв + форма + ссылки)   -->
        <!-- Будет заполнен позже                         -->
        <!-- ============================================= -->
        <section id="contacts">
            <!-- Сюда вставим: призывной текст, кнопку Telegram, форму, email -->
        </section>

    </main>

    <!-- ============================================= -->
    <!-- ПАЗЛ 10: ПОДВАЛ (footer)                      -->
    <!-- Будет заполнен позже                         -->
    <!-- ============================================= -->
    <footer id="footer">
        <!-- Сюда вставим: копирайт, ссылки на соцсети -->
    </footer>

    <!-- ============================================= -->
    <!-- ПАЗЛ 11: ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ (JavaScript)   -->
    <!-- Будет заполнен позже                         -->
    <!-- ============================================= -->
    <script src="js/script.js"></script>
</body>
</html>
